# Dynamical Bidding Zones (DBZ) overlay, deep-merged over config/default.yaml by
# bzgen.dbz.load_config().  Only keys that differ from, or are new relative to,
# the static pipeline live here.

edges:
  # How a per-country remedy parameter (clip threshold, log1p median) and the
  # per-country normalising mean are applied to a cross-border edge.
  #   average: the mean of the two endpoint countries' values (m_i + m_j) / 2.
  # Intra-country edges are unaffected (m_i == m_j).  `rank` remedies are
  # rejected for DBZ: a mid-rank is not defined across a border.
  cross_border_remedy: average
  # Countries whose intra-country raw statistic mean is below edges.signal_min
  # (the static "no congestion signal" flag).  `keep`: they keep their own scale
  # as the denominator of their cross-border edges, exactly as within the country;
  # the averaged clip threshold bounds the amplification (reports/dbz_graph.md).
  no_signal_policy: keep

anneal:
  # Balance floor as a fraction of the mean zone share: floor = frac / K.
  # 0.15 / 3 = 0.05 reproduces the static absolute floor at k = 3.
  balance_floor_frac_of_mean: 0.15

dbz:
  # The static map A that the rigidity term anchors to.  Default: the static
  # headline (sweep.headline in default.yaml), the largest alpha with >= 95 % of
  # zones above the balance floor.  See reports/dbz_results.md.
  anchor_config_id: a2_lc0.1_lb0.5_dk+0
  # alpha, lambda_b of the anchor configuration are reused for B (so that A is a
  # static optimum of the same physical terms B is optimised against).
  lambda_rigid: [0.0, 0.1, 0.3, 1.0, 3.0, 10.0]
  # T0 sanity band (fail loudly outside it).
  T0_band: [1.0e-3, 1.0e3]
  # Restarts run in parallel over this many worker processes.
  workers: 4
  smoke:
    n_temps: 6
    sweeps_per_temp: 1
    quench_sweeps: 1
    restarts: 2
